name: Bug Report
description: Report a bug in mitsubishi-comfort
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If you are using this library through the Home Assistant Mitsubishi Comfort integration,
        please report issues at [Home Assistant Core](https://github.com/home-assistant/core/issues)
        and tag `@nikolairahimi`.**

        Only file issues here for bugs in the library itself (outside of Home Assistant).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
