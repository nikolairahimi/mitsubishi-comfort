[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsubishi-comfort"
version = "0.4.0"
description = "Async Python library for Mitsubishi minisplit control via Kumo Cloud and local API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Nikolai Rahimi", email = "nikolairahimi@users.noreply.github.com"},
]
keywords = ["mitsubishi", "kumo", "minisplit", "hvac", "home-assistant", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/nikolairahimi/mitsubishi-comfort"
Repository = "https://github.com/nikolairahimi/mitsubishi-comfort"
Issues = "https://github.com/nikolairahimi/mitsubishi-comfort/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aioresponses>=0.7.8",
    # aioresponses 0.7.8 (its latest) doesn't support aiohttp 3.14's
    # ClientResponse(stream_writer=...) signature, which breaks every mocked
    # test. Cap aiohttp for the test environment until a compatible aioresponses
    # release ships; the runtime dependency (aiohttp>=3.9.0) stays unconstrained.
    "aiohttp<3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mitsubishi_comfort"]
branch = true

[tool.coverage.report]
show_missing = true
