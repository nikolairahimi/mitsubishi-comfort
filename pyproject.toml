[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsubishi-comfort"
version = "0.2.0"
description = "Async Python library for Mitsubishi minisplit control via Kumo Cloud and local API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Nikolai Rahimi", email = "nikolairahimi@users.noreply.github.com"},
]
keywords = ["mitsubishi", "kumo", "minisplit", "hvac", "home-assistant", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/nikolairahimi/mitsubishi-comfort"
Repository = "https://github.com/nikolairahimi/mitsubishi-comfort"
Issues = "https://github.com/nikolairahimi/mitsubishi-comfort/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
